name: Bug report
description: Report a reproducible WireAtlas defect using synthetic data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach real packet captures, credentials, private addresses, or identifying data.
        Follow SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the exact command and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Describe code using tools/synthetic_capture.hpp; do not upload a real capture.
    validations:
      required: true
